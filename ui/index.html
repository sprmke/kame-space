    />
    <title>Kame Space</title>
    <meta
      name="description"
      content="Book condos, homes, and parking across the Philippines. Browse by place, check dates, and reserve online."
    />

    <!-- Default link preview is available to crawlers without JavaScript. -->
    <meta property="og:site_name" content="Kame Space" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_PH" />
    <!-- og:url is set per route by the middleware snapshot / usePageMeta. A hardcoded
         homepage value was wrong on every other page. -->
    <meta property="og:title" content="Kame Space" />
    <meta
      property="og:description"
      content="Book condos, homes, and parking across the Philippines. Browse by place, check dates, and reserve online."
    />
    <meta property="og:image" content="https://kamespace.com/brand/kame-space-social-f5.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="KameSpace" />

    <meta name="twitter:title" content="Kame Space" />

      name="twitter:description"
      content="Book condos, homes, and parking across the Philippines. Browse by place, check dates, and reserve online."

    <meta name="twitter:image:alt" content="KameSpace" />

    <meta name="application-name" content="Kame Space" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kame Space" />
    <!--
      One theme-color meta, kept in sync by theme-init.js (before first paint) and
      ThemeProvider (on an in-app theme toggle). Media-scoped duplicates would win
      over the app's own theme, which is the wrong signal when a user picks dark
      inside a light-OS device.
    -->
    <meta name="theme-color" content="#f5f6f8" />
    <!-- vite-plugin-pwa injects <link rel="manifest"> + the register script -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=f5" />

    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Only the product font is requested here. The fourteen display families exist for
      host-themed showcase pages and stay guides, nothing else uses them, and every visitor was
      downloading their stylesheet on every route. `src/lib/fonts/displayFonts.ts` appends them
      when `ShowcaseShell` mounts, so a showcase page still gets its face while listings,
      booking, auth and the dashboard never fetch it.

      Loaded as `preload` + swap-to-stylesheet on load (`/async-styles.js`, no inline handler for
      CSP) so the stylesheet is never render-blocking. Do not remove the swap without
      re-verifying LCP on `/` and `/properties` (see
      docs/workflow/in-progress/production-readiness/checklist/04-defer-non-critical-scripts.md).
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      data-async-style
    />
    <script src="/async-styles.js" defer></script>
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      />
    </noscript>
    <!-- Favicon — root-absolute paths so nested routes (e.g. /org/.../property/...) resolve correctly -->
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="mask-icon" href="/favicon/safari-pinned-tab.svg" color="#2DAA97" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
