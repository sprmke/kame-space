name: CD Deploy (Supabase)

# The single backend deploy pipeline.
#
# There is one Supabase project (`fwor…`, "Kame Space") serving both `develop` and the
# production app, so there is nothing for a second pipeline to deploy to. `cd-dev.yml`,
# `cd-preprod.yml` and the old gated `cd-prod.yml` all pointed at the same ref and each
# duplicated a quality gate; they are gone.
#
# Trigger: push to `develop`, or run manually.
# UI deploys separately — Vercel Preview for `develop`, Vercel Production at release.

on:
  push:
    branches:
      - develop
    # Supabase-only workflow — skip when a push touches only docs/UI (Vercel deploys UI).
    paths:
      - '.github/workflows/cd-prod.yml'
      - 'scripts/deploy/**'
      # The deploy path sources the linked-project classifier and other helpers from here, so
      # a change to deploy tooling must run the pipeline that depends on it.
      - 'scripts/dev/**'
      - 'supabase/**'
  workflow_dispatch:
    inputs:
      include_all:
        description: 'Pass --include-all to db push (migration repair)'
        required: false
        default: 'false'
        type: boolean
      force_deploy:
        description: 'Deploy even when no supabase/functions or supabase/migrations file changed'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      # Same verified module cache the PR CI job uses. Without it the quality gate
      # downloads every esm.sh/jsr module cold on each deploy; a remote rebuild can
      # then fail the lock integrity check even though CI (with cache) passes.
      - name: Cache Deno dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: deno-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bun x playwright install chromium --with-deps

      - name: Quality gate
        run: ./scripts/dev/ci-deploy-gate.sh --skip-install

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      # Read the previous successful run to find the last deployed commit.
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          ./scripts/dev/bunx --bun supabase@latest link --project-ref "$SUPABASE_PROJECT_REF"

      # The deploy used to push all 345 edge functions on every merge, 19 minutes for a
      # push that touched no function (run 42562585557). Compare against the last
      # *successful* deploy instead: a failed or partial run leaves the marker older, so
      # its changes are still in the diff and nothing can be skipped by accident.
      - name: Detect backend changes since the last successful deploy
        id: backend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Safe default first: GitHub keeps the LAST value written, so `false` is only ever
          # published after the diff has actually been proven empty. Any unexpected failure
          # in this step therefore deploys rather than skipping. `set -e` is deliberately off
          # for the same reason.
          set -uo pipefail
          echo "changed=true" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event.inputs.force_deploy }}" == "true" ]]; then
            echo "Manual dispatch asked for a full deploy."
            exit 0
          fi

          prev=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/cd-prod.yml/runs?branch=develop&status=success&per_page=10" \
            --jq '[.workflow_runs[] | select(.head_sha != "'"$GITHUB_SHA"'")][0].head_sha // ""' 2>/dev/null || echo "")

          if [[ -z "$prev" ]]; then
            echo "No previous successful deploy found; deploying everything."
            exit 0
          fi

          if ! git fetch --no-tags --depth=1 origin "$prev" 2>/dev/null; then
            echo "Could not fetch the previous deploy commit $prev; deploying everything."
            exit 0
          fi

          # Safe default: deploy every function. Narrowed below only when provably safe.
          echo "functions=all" >> "$GITHUB_OUTPUT"

          if git diff --quiet FETCH_HEAD "$GITHUB_SHA" -- supabase/functions supabase/migrations; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "functions=none" >> "$GITHUB_OUTPUT"
            echo "No function or migration changes since $prev."
            exit 0
          fi

          echo "Backend changes since $prev:"
          git diff --name-only FETCH_HEAD "$GITHUB_SHA" -- supabase/functions supabase/migrations | sed 's/^/  /'

          # Deploying all 345 functions took ~19 minutes per deploy. Narrow it to the changed
          # directories, but deploy everything whenever shared code moved: `_shared/**` is
          # bundled into every function at deploy time, so a change there can affect all.
          if git diff --quiet FETCH_HEAD "$GITHUB_SHA" -- supabase/functions; then
            echo "functions=none" >> "$GITHUB_OUTPUT"
            echo "Only migrations changed; functions deploy skipped."
            exit 0
          fi

          changed_functions=$(git diff --name-only FETCH_HEAD "$GITHUB_SHA" -- supabase/functions)

          if echo "$changed_functions" \
            | grep -qE '^supabase/functions/(_shared/|deno\.json|import_map\.json|\.npmrc)'; then
            echo "functions=all" >> "$GITHUB_OUTPUT"
            echo "Shared edge code changed; deploying every function."
            exit 0
          fi

          names=$(echo "$changed_functions" \
            | awk -F/ 'NF >= 3 && $3 != "tests" && $3 !~ /\./ { print $3 }' \
            | sort -u | tr '\n' ' ' | sed 's/ *$//')

          if [[ -z "$names" ]]; then
            if ! echo "$changed_functions" | grep -qvE '^supabase/functions/tests/'; then
              echo "functions=none" >> "$GITHUB_OUTPUT"
              echo "Only edge test files changed; functions deploy skipped."
            else
              echo "functions=all" >> "$GITHUB_OUTPUT"
              echo "Could not narrow the function list; deploying everything."
            fi
          else
            echo "functions=$names" >> "$GITHUB_OUTPUT"
            echo "Deploying only: $names"
          fi

      - name: Capture pre-deploy schema diff
        if: steps.backend.outputs.changed == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: ./scripts/dev/bunx --bun supabase@latest db diff --linked > pre-deploy-schema-diff.sql

      - name: Upload schema diff
        if: steps.backend.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pre-deploy-schema-diff-${{ github.sha }}
          path: pre-deploy-schema-diff.sql
          retention-days: 30

      - name: Deploy Supabase
        if: steps.backend.outputs.changed == 'true'
        env:
          CI: '1'
          DEPLOY_FUNCTIONS: ${{ steps.backend.outputs.functions }}
          DEPLOY_CONFIRM: prod
          INCLUDE_ALL: ${{ github.event.inputs.include_all }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
        run: |
          # Strict migration order by default: this project holds the live booking dataset.
          # `--include-all` is available from the manual dispatch input for migration repair.
          if [[ "${INCLUDE_ALL:-}" == "true" ]]; then
            ./scripts/deploy/ci-deploy.sh prod -- --include-all
          else
            ./scripts/deploy/ci-deploy.sh prod
          fi

      - name: Upload pre-deploy backup
        if: always() && steps.backend.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pre-deploy-backup-${{ github.sha }}
          path: backups/prod/
          if-no-files-found: error
          retention-days: 7

      - name: Smoke public endpoints
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SMOKE_PROPERTY_SLUG: ${{ vars.SMOKE_PROPERTY_SLUG }}
        run: ./scripts/deploy/ci-smoke.sh prod

      - name: Verify migration parity
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: ./scripts/deploy/check-migration-drift.sh
